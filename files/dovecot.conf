dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp
listen = *
log_path = /dev/stderr

ssl = required
ssl_server_cert_file = /etc/mailtest/tls/server.crt
ssl_server_key_file = /etc/mailtest/tls/server.key

auth_mechanisms = plain login

# user:{PLAIN}password:uid:gid::home:: - written by setup.sh from files/users
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

mail_driver = maildir
mail_path = ~/Maildir

# special folders like the hosters have them (the clients are set to use no Trash anyway)
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# IMAPS (993) only
service imap-login {
  inet_listener imap {
    port = 0
  }
}

# Postfix: delivery (LMTP) and SMTP AUTH for submission
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    user = postfix
    group = postfix
    mode = 0600
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    user = postfix
    group = postfix
    mode = 0660
  }
}
